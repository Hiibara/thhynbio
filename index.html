<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Huyen | Đang Bảo Trì</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Dosis:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Dosis', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050508 100%);
            position: relative;
        }

        /* Hiệu ứng nền sao lấp lánh tương tự trang chính */
        .bg-background {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .stars-layer {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background-image:
                radial-gradient(circle, #fff 1px, transparent 1.5px),
                radial-gradient(circle, rgba(255,255,255,0.4) 1.5px, transparent 2px);
            background-size: 300px 300px, 200px 200px;
            opacity: 0.35;
            animation: starsMove 35s linear infinite;
        }

        @keyframes starsMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(100px, 150px) rotate(4deg); }
        }

        /* Khung thông báo bảo trì chính */
        .maintenance-card {
            position: relative;
            z-index: 5;
            background: rgba(10, 10, 15, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 28px;
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            animation: cardFloat 4s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        /* Icon trang trí phía trên */
        .maintenance-icon {
            font-size: 45px;
            color: #b76cf7;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(183, 108, 247, 0.6);
            animation: iconPulse 2s ease-in-out infinite alternate;
        }

        @keyframes iconPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Tiêu đề */
        .maintenance-title {
            font-family: 'Comfortaa', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        /* Nội dung thông báo */
        .maintenance-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Nút liên hệ Discord nhanh */
        .btn-discord {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(88, 101, 242, 0.15);
            border: 1px solid rgba(88, 101, 242, 0.4);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.2);
        }

        .btn-discord:hover {
            background: rgba(88, 101, 242, 0.3);
            border-color: rgba(88, 101, 242, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(88, 101, 242, 0.4);
        }

        /* Dòng chữ nhỏ phía dưới cùng */
        .made-by {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.8px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="bg-background">
        <div class="stars-layer"></div>
    </div>

    <div class="maintenance-card">
        <div class="maintenance-icon">
            <i class="fas fa-wand-magic-sparkles"></i>
        </div>
        <div class="maintenance-title">Góc nhỏ đang nâng cấp</div>
        <div class="maintenance-desc">
            Huyền đang chỉnh sửa và trang hoàng lại một chút để góc nhỏ trở nên lung linh hơn. Cậu quay lại sau ít phút nữa nhé! 🥰✨
        </div>
        <a href="https://discord.com/users/haibaraainiee" target="_blank" class="btn-discord">
            <i class="fab fa-discord"></i> haibaraainiee
        </a>
    </div>

    <div class="made-by">Made by Huyen</div>

</body>
</html>
